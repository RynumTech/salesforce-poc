name: Salesforce CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-org:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 'Install Salesforce CLI'
        run: |
          npm install @salesforce/cli --global

      - name: 'Authenticate Salesforce Org'
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./authfile.txt
          sf org login sfdx-url --sfdx-url-file ./authfile.txt --set-default --alias targetOrg
          rm ./authfile.txt

      - name: 'Deploy Metadata'
        run: sf project deploy start --target-org targetOrg --wait 10